<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #00ff88;
    --accent2: #00b8ff;
    --danger: #ff4466;
    --text: #e0e0f0;
    --muted: #555570;
    --radius: 6px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Fondo animado */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 80%, rgba(0,255,136,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 20%, rgba(0,184,255,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  /* ===== AUTH PANEL ===== */
  #auth-panel {
    width: 100%;
    max-width: 420px;
    padding: 20px;
    animation: fadeUp 0.4s ease;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .tagline {
    color: var(--muted);
    font-size: 0.75rem;
    margin-bottom: 40px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .tabs {
    display: flex;
    gap: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 28px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .tab.active {
    background: var(--border);
    color: var(--accent);
  }

  .form-group {
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(0,255,136,0.08);
  }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 8px;
  }

  .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .msg-box {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 0.8rem;
    display: none;
  }

  .msg-box.error { background: rgba(255,68,102,0.1); border: 1px solid rgba(255,68,102,0.3); color: var(--danger); }
  .msg-box.success { background: rgba(0,255,136,0.07); border: 1px solid rgba(0,255,136,0.2); color: var(--accent); }
  .msg-box.show { display: block; }

  /* ===== CHAT PANEL ===== */
  #chat-panel {
    display: none;
    width: 100%;
    max-width: 700px;
    height: 100vh;
    max-height: 640px;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    animation: fadeUp 0.4s ease;
    margin: 20px;
  }

  #chat-panel.visible { display: flex; }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .chat-header-left { display: flex; align-items: center; gap: 10px; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2s infinite;
  }

  .chat-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
  }

  .chat-user {
    font-size: 0.75rem;
    color: var(--accent2);
    letter-spacing: 0.05em;
  }

  .btn-logout {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: var(--radius);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
  }

  .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .msg {
    max-width: 72%;
    animation: msgIn 0.2s ease;
  }

  .msg.mine { align-self: flex-end; }
  .msg.theirs { align-self: flex-start; }
  .msg.system { align-self: center; max-width: 100%; }

  .msg-author {
    font-size: 0.65rem;
    color: var(--muted);
    margin-bottom: 3px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .msg-bubble {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.85rem;
    line-height: 1.5;
    word-break: break-word;
  }

  .mine .msg-bubble {
    background: rgba(0,255,136,0.12);
    border: 1px solid rgba(0,255,136,0.2);
    color: var(--text);
    border-bottom-right-radius: 2px;
  }

  .theirs .msg-bubble {
    background: var(--bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 2px;
  }

  .system .msg-bubble {
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 0.72rem;
    text-align: center;
    letter-spacing: 0.05em;
  }

  .chat-input-area {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  #msg-input {
    flex: 1;
    margin: 0;
  }

  .btn-send {
    width: auto;
    padding: 12px 20px;
    margin: 0;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    letter-spacing: 0.05em;
  }

  .btn-send:hover { filter: brightness(1.1); }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
</style>
</head>
<body>

<!-- AUTH PANEL -->
<div id="auth-panel">
  <div class="logo">chat//</div>
  <div class="tagline">Sistema de chat en tiempo real</div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
    <button class="tab" onclick="switchTab('register')">Registrarse</button>
  </div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="tu_usuario" autocomplete="off">
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••">
  </div>

  <button class="btn" id="auth-btn" onclick="handleAuth()">Iniciar sesión</button>
  <div class="msg-box" id="auth-msg"></div>
</div>

<!-- CHAT PANEL -->
<div id="chat-panel">
  <div class="chat-header">
    <div class="chat-header-left">
      <div class="status-dot" id="status-dot"></div>
      <div>
        <div class="chat-title">chat//</div>
        <div class="chat-user" id="chat-username-label"></div>
      </div>
    </div>
    <button class="btn-logout" onclick="logout()">desconectar</button>
  </div>

  <div id="messages"></div>

  <div class="chat-input-area">
    <input type="text" id="msg-input" placeholder="Escribí un mensaje..." autocomplete="off" onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="btn-send" onclick="sendMsg()">enviar →</button>
  </div>
</div>

<script>
  const API = "http://127.0.0.1:5001";
  const WS_URL = "ws://127.0.0.1:5000";

  let currentTab = "login";
  let ws = null;
  let myUsername = "";

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll(".tab").forEach((t, i) => {
      t.classList.toggle("active", (tab === "login" && i === 0) || (tab === "register" && i === 1));
    });
    document.getElementById("auth-btn").textContent =
      tab === "login" ? "Iniciar sesión" : "Registrarse";
    showMsg("", "");
  }

  function showMsg(text, type) {
    const el = document.getElementById("auth-msg");
    el.textContent = text;
    el.className = "msg-box" + (text ? ` ${type} show` : "");
  }

  async function handleAuth() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("auth-btn");

    if (!username || !password) { showMsg("Completá todos los campos.", "error"); return; }

    btn.disabled = true;
    btn.textContent = "...";

    try {
      if (currentTab === "register") {
        const r = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const d = await r.json();
        if (r.ok) {
          showMsg("✓ Usuario creado. Ahora iniciá sesión.", "success");
          switchTab("login");
        } else {
          showMsg("✗ " + d.error, "error");
        }
      } else {
        const r = await fetch(`${API}/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });
        const d = await r.json();
        if (r.ok) {
          myUsername = username;
          connectWS(username, password);
        } else {
          showMsg("✗ " + d.error, "error");
        }
      }
    } catch (e) {
      showMsg("✗ No se pudo conectar con el servidor.", "error");
    }

    btn.disabled = false;
    btn.textContent = currentTab === "login" ? "Iniciar sesión" : "Registrarse";
  }

  function connectWS(username, password) {
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
      ws.send(JSON.stringify({ username, password }));
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.error) {
        showMsg("✗ " + data.error, "error");
        ws.close();
        return;
      }

      if (data.ok) {
        // Login WS exitoso → mostrar chat
        document.getElementById("auth-panel").style.display = "none";
        const chatPanel = document.getElementById("chat-panel");
        chatPanel.classList.add("visible");
        document.getElementById("chat-username-label").textContent = "@" + username;
        addSystemMsg(data.message);
        return;
      }

      if (data.system) { addSystemMsg(data.system); return; }
      if (data.from)   { addMsg(data.from, data.message, false); }
    };

    ws.onclose = () => {
      addSystemMsg("Conexión cerrada.");
      document.getElementById("status-dot").style.background = "var(--danger)";
      document.getElementById("status-dot").style.boxShadow = "0 0 6px var(--danger)";
    };

    ws.onerror = () => {
      showMsg("✗ No se pudo conectar al servidor de chat.", "error");
    };
  }

  function sendMsg() {
    const input = document.getElementById("msg-input");
    const text = input.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

    ws.send(text);
    addMsg(myUsername, text, true);
    input.value = "";
  }

  function addMsg(from, text, mine) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `msg ${mine ? "mine" : "theirs"}`;
    div.innerHTML = `
      ${!mine ? `<div class="msg-author">${from}</div>` : ""}
      <div class="msg-bubble">${escHtml(text)}</div>
    `;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function addSystemMsg(text) {
    const msgs = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = "msg system";
    div.innerHTML = `<div class="msg-bubble">${escHtml(text)}</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escHtml(t) {
    return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function logout() {
    if (ws) ws.close();
    location.reload();
  }
</script>
</body>
</html>
